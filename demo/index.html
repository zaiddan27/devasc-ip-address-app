<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IP_PAPI live demo</title>
<meta name="description" content="Try IP_PAPI in the browser: the team's real Python modules, loaded from GitHub and run with Pyodide.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;700&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
  :root {
    --paper: #F6F4EE;
    --paper-2: #E6E1D7;
    --sheet: #FBFAF7;
    --ink: #111111;
    --ink-2: #333333;
    --muted: #5F5B54;
    --taupe: #BEB8AD;
    --hair: #D6D0C4;
    --display: "Bahnschrift", "Barlow Semi Condensed", "Arial Narrow", sans-serif;
    --body: "Segoe UI", "IBM Plex Sans", system-ui, sans-serif;
    --mono: "Cascadia Mono", "IBM Plex Mono", Consolas, monospace;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--paper); color: var(--ink); font: 15px/1.5 var(--body); }
  a { color: inherit; }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .bar {
    display: flex; flex-wrap: wrap; gap: 6px 22px; align-items: center;
    padding: 9px max(16px, 2.2vw); background: var(--ink); color: var(--sheet);
    font-size: 12.5px; letter-spacing: .02em;
  }
  .bar b { font-family: var(--display); font-weight: 700; letter-spacing: .28em; font-size: 12px; }
  .bar .src { color: #CFC9BD; }
  .bar .src code { font-family: var(--mono); color: var(--sheet); }
  .bar nav { margin-left: auto; display: flex; gap: 18px; }
  .bar nav a { text-decoration: none; border-bottom: 1px solid #6F6B64; }
  .bar nav a:hover { border-color: var(--sheet); }

  .app { display: grid; grid-template-columns: 290px minmax(0, 1fr); min-height: calc(100vh - 38px); }

  aside { background: var(--paper-2); padding: 40px 0 28px; display: flex; flex-direction: column; }
  .brand { padding: 0 32px 34px; }
  .brand h1 { margin: 0; font: 700 30px/1 var(--display); letter-spacing: .04em; }
  .brand p { margin: 8px 0 0; font: 700 10.5px/1 var(--body); letter-spacing: .34em; color: var(--muted); }
  .nav { list-style: none; margin: 0; padding: 0; }
  .nav button {
    width: 100%; display: grid; grid-template-columns: 34px 1fr; align-items: baseline;
    padding: 13px 32px; border: 0; background: transparent; text-align: left; cursor: pointer;
  }
  .nav button span:first-child { font: 600 13px var(--mono); color: var(--muted); }
  .nav button:hover { background: #DCD6CA; }
  .nav button[aria-current="true"] { background: var(--ink); color: var(--sheet); font-weight: 600; }
  .nav button[aria-current="true"] span:first-child { color: var(--sheet); }
  .side-foot { margin-top: auto; padding: 24px 32px 0; font-size: 12px; color: var(--muted); line-height: 1.6; }
  .side-foot kbd { font: 600 11px var(--mono); border: 1px solid var(--taupe); padding: 0 5px; border-radius: 2px; color: var(--ink-2); }

  main { background: var(--sheet); padding: 44px 56px 28px; display: flex; flex-direction: column; min-width: 0; }
  .big { font: 700 92px/0.9 var(--display); letter-spacing: -.01em; }
  .section { margin-top: 18px; font: 700 11px/1 var(--body); letter-spacing: .42em; color: var(--muted); text-transform: uppercase; }
  h2 { margin: 10px 0 6px; font: 700 30px/1.1 var(--display); text-wrap: balance; }
  .desc { margin: 0 0 24px; max-width: 62ch; color: var(--ink-2); }

  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
  .prompt { display: block; font: 700 10.5px/1 var(--body); letter-spacing: .32em; color: var(--muted); text-transform: uppercase; margin-bottom: 9px; }
  .field { flex: 1 1 320px; max-width: 520px; min-width: 0; padding: 11px 13px; border: 1px solid var(--ink); background: #fff; font: 15px var(--mono); border-radius: 0; }
  .btn { padding: 11px 20px; border: 1px solid var(--ink); background: var(--ink); color: var(--sheet); font-weight: 600; cursor: pointer; border-radius: 0; }
  .btn.ghost { background: transparent; color: var(--ink); }
  .btn:disabled { background: var(--paper-2); border-color: var(--taupe); color: var(--ink-2); cursor: wait; }
  .btn:not(:disabled):hover { background: var(--ink-2); color: var(--sheet); }

  .tries { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 0 0 22px; font-size: 12.5px; color: var(--muted); }
  .tries button { font: 12.5px var(--mono); padding: 3px 9px; border: 1px solid var(--hair); background: var(--paper); cursor: pointer; }
  .tries button:hover { border-color: var(--ink); }

  .result { border-top: 1px solid var(--hair); padding-top: 22px; min-height: 220px; }
  .hint { color: var(--muted); margin: 0; }
  .rhead { display: flex; flex-wrap: wrap; gap: 14px; align-items: baseline; margin-bottom: 12px; }
  .rhead b { font: 700 11px var(--body); letter-spacing: .36em; text-transform: uppercase; }
  .rhead span { font: 15px var(--mono); color: var(--ink-2); overflow-wrap: anywhere; }
  dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 3px 34px; margin: 0; }
  dt { color: var(--muted); }
  dd { margin: 0; font: 600 15px var(--mono); overflow-wrap: anywhere; }
  dd.info { font-weight: 400; color: var(--muted); font-style: italic; }
  dd.hidden { filter: blur(6px); user-select: none; cursor: pointer; }
  .gauge { margin-top: 18px; }
  .gauge .cells { display: flex; gap: 3px; margin: 7px 0 5px; flex-wrap: wrap; }
  .gauge .cells i { width: 13px; height: 13px; background: var(--taupe); }
  .gauge .cells i.on { background: var(--ink); }
  .gauge small { color: var(--muted); }
  .error { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .badge { font: 700 10.5px/1 var(--body); letter-spacing: .14em; padding: 4px 7px; background: var(--ink); color: var(--sheet); }
  .badge.soft { background: var(--paper-2); color: var(--ink); }
  .error p { margin: 0; font-weight: 600; max-width: 64ch; }
  .ran { margin-top: 18px; font-size: 12.5px; color: var(--muted); }
  .ran code { font-family: var(--mono); color: var(--ink-2); }

  .status { margin-top: auto; padding-top: 22px; display: flex; gap: 10px; align-items: center; min-height: 44px; font-size: 13.5px; color: var(--muted); }
  .status .badge:empty { display: none; }
  .privacy { display: inline-flex; gap: 7px; align-items: center; font-size: 12.5px; color: var(--muted); cursor: pointer; margin: -6px 0 18px; }

  .spin { display: inline-block; width: 10px; height: 10px; border: 2px solid var(--taupe); border-top-color: var(--ink); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }

  @media (max-width: 820px) {
    .app { grid-template-columns: 1fr; }
    aside { padding: 22px 0 0; }
    .brand { padding: 0 16px 16px; }
    .nav { display: flex; overflow-x: auto; }
    .nav button { grid-template-columns: auto auto; gap: 6px; padding: 12px 16px; white-space: nowrap; }
    .side-foot { display: none; }
    main { padding: 28px 16px 20px; }
    .big { font-size: 64px; }
    .bar nav { margin-left: 0; }
  }
</style>
</head>
<body>

<div class="bar">
  <b>LIVE DEMO</b>
  <span class="src" id="source">Loading the team's Python modules from GitHub…</span>
  <nav>
    <a href="../">Presentation</a>
    <a href="https://github.com/zaiddan27/devasc-ip-address-app" target="_blank" rel="noopener">Repository</a>
  </nav>
</div>

<div class="app">
  <aside>
    <div class="brand">
      <h1>IP_PAPI</h1>
      <p>NETWORK TOOLKIT</p>
    </div>
    <ul class="nav" id="nav"></ul>
    <div class="side-foot">
      Keys <kbd>1</kbd>–<kbd>5</kbd> switch features, <kbd>Enter</kbd> runs.<br>
      Team NEVER GROW OLD · DEVASC Project Activity 3
    </div>
  </aside>

  <main>
    <div class="big" id="big">01</div>
    <div class="section" id="section">public ip</div>
    <h2 id="title">My public IP</h2>
    <p class="desc" id="desc"></p>

    <form id="inputRow" class="input" hidden>
      <label class="prompt" for="field" id="prompt">IP address</label>
      <div class="row">
        <input class="field" id="field" autocomplete="off" spellcheck="false">
        <button class="btn" id="runBtn" type="submit" disabled>Run</button>
      </div>
      <div class="tries" id="tries"></div>
    </form>

    <div id="myipRow" hidden>
      <div class="row"><button class="btn" id="myipBtn" type="button" disabled>Check my IP</button></div>
      <label class="privacy"><input type="checkbox" id="blur" checked> Blur my address (for screen recording). Click a blurred value to show it.</label>
    </div>

    <div id="exportRow" hidden>
      <div class="row">
        <button class="btn" id="jsonBtn" type="button">Save as JSON</button>
        <button class="btn ghost" id="csvBtn" type="button">Save as CSV</button>
      </div>
    </div>

    <div class="result" id="result" aria-live="polite"></div>

    <div class="status" id="status"><span class="badge" id="badge"></span><span id="statusText"></span></div>
  </main>
</div>

<script>
const REPO = "https://github.com/zaiddan27/devasc-ip-address-app";

const FEATURES = [
  { n: "1", label: "My public IP", action: "my_ip", section: "public ip",
    desc: "Reads this computer's public IPv4 and IPv6 address and asks the provider APIs who owns it.",
    fn: "ip_info.get_public_ipv4() · get_public_ipv6() · get_ip_details()", file: "ip_info.py" },
  { n: "2", label: "Look up an IP or domain", action: "lookup", section: "lookup",
    prompt: "IP address or domain", example: "8.8.8.8",
    tries: ["8.8.8.8", "cisco.com", "https://www.github.com/zaiddan27", "10.0.0.5", "999.1.1.1"],
    hint: "Type an IP address, a domain such as cisco.com, or paste a URL, then press Enter.",
    desc: "Looks up any IP address, domain name or pasted URL. Private addresses are answered without calling an API.",
    fn: "lookup.lookup()", file: "lookup.py" },
  { n: "3", label: "Classify an IP address", action: "classify", section: "classify",
    prompt: "IP address", example: "10.0.0.5",
    tries: ["10.0.0.5", "8.8.8.8", "127.0.0.1", "169.254.10.1", "100.64.0.1", "2001:4860:4860::8888"],
    hint: "Type an IPv4 or IPv6 address, then press Enter.",
    desc: "Works offline. Says whether an address is private (RFC 1918), public, loopback, link-local and so on.",
    fn: "subnet_tools.classify_address()", file: "subnet_tools.py" },
  { n: "4", label: "Subnet calculator", action: "subnet", section: "subnet",
    prompt: "Network in CIDR notation", example: "192.168.10.0/26",
    tries: ["192.168.10.0/26", "10.0.0.0/8", "192.168.10.5/30", "172.16.0.0/31", "2001:db8::/64"],
    hint: "Type a network such as 192.168.10.0/26, then press Enter.",
    desc: "Works offline. Mask, wildcard, broadcast, host range and how many hosts fit.",
    fn: "subnet_tools.subnet_info()", file: "subnet_tools.py" },
  { n: "5", label: "Export last result", action: "export", section: "export",
    desc: "Saves the last result as a JSON or CSV file, ready to attach to a ticket. Same format as ui.export_json() and ui.export_csv()." },
];

const $ = (id) => document.getElementById(id);
const state = { current: null, busy: false, ready: false, ref: "main", last: null, lastTitle: "", lastAction: null, nextId: 1 };
const worker = new Worker("worker.js");
const pending = new Map();

worker.onmessage = (e) => {
  const m = e.data;
  if (m.type === "progress") {
    setStatus("info", m.text + " …", true);
  } else if (m.type === "ready") {
    state.ready = true;
    state.ref = m.ref;
    const short = m.ref === "main" ? "main" : m.ref.slice(0, 7);
    const link = m.ref === "main" ? `${REPO}/tree/main` : `${REPO}/commit/${m.ref}`;
    $("source").innerHTML = `Running <code>${m.modules.join(", ")}</code> from <a href="${link}" target="_blank" rel="noopener"><code>main@${short}</code></a> in your browser with Python (Pyodide).`;
    setStatus("", "Ready. Pick a feature, or press Enter.");
    syncButtons();
  } else if (m.type === "failed") {
    $("source").textContent = "Python did not load.";
    setStatus("error", `Could not start the demo: ${m.text}. Check the connection and reload.`);
  } else if (m.type === "result") {
    const resolve = pending.get(m.id);
    pending.delete(m.id);
    if (resolve) resolve(m.payload);
  }
};

function call(action, value) {
  const id = state.nextId++;
  return new Promise((resolve) => {
    pending.set(id, resolve);
    worker.postMessage({ id, action, value });
  });
}

function buildNav() {
  for (const f of FEATURES) {
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.type = "button";
    b.dataset.action = f.action;
    b.innerHTML = `<span>0${f.n}</span><span>${f.label}</span>`;
    b.addEventListener("click", () => select(f.action));
    li.appendChild(b);
    $("nav").appendChild(li);
  }
}

function feature(action) { return FEATURES.find((f) => f.action === action); }

function select(action) {
  if (state.busy) return;
  state.current = action;
  const f = feature(action);
  document.querySelectorAll("#nav button").forEach((b) => b.setAttribute("aria-current", String(b.dataset.action === action)));
  $("big").textContent = "0" + f.n;
  $("section").textContent = f.section;
  $("title").textContent = f.label;
  $("desc").textContent = f.desc;
  $("inputRow").hidden = !f.prompt;
  $("myipRow").hidden = action !== "my_ip";
  $("exportRow").hidden = action !== "export";

  if (f.prompt) {
    $("prompt").textContent = f.prompt;
    $("field").value = f.example;
    $("tries").innerHTML = "<span>Try</span>";
    for (const t of f.tries) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = t;
      b.addEventListener("click", () => { $("field").value = t; run(); });
      $("tries").appendChild(b);
    }
    hint(f.hint);
    $("field").focus();
    $("field").select();
  } else if (action === "my_ip") {
    hint("Press Check my IP to read your public address and provider.");
  } else if (state.last) {
    showResult(state.lastTitle, state.last, state.lastAction);
  } else {
    hint("Nothing to export yet. Run one of features 1 to 4 first.");
  }
  if (state.ready) setStatus("", "");
  syncButtons();
}

function syncButtons() {
  const off = !state.ready || state.busy;
  $("runBtn").disabled = off;
  $("myipBtn").disabled = off;
  $("runBtn").textContent = state.ready ? "Run" : "Loading…";
  $("myipBtn").textContent = state.ready ? "Check my IP" : "Loading…";
}

async function run() {
  const action = state.current;
  if (!state.ready || state.busy || action === "export") return;
  const value = action === "my_ip" ? "" : $("field").value;
  state.busy = true;
  syncButtons();
  setStatus("info", `Working on ${action === "my_ip" ? "your public IP" : (value.trim() || "input")} …`, true);
  const payload = await call(action, value);
  state.busy = false;
  syncButtons();
  if (action !== state.current) return;
  if (payload.ok) {
    state.last = payload.data;
    state.lastTitle = payload.title;
    state.lastAction = action;
    showResult(payload.title, payload.data, action);
    setStatus("ok", "Done. Feature 5 can save this result.");
  } else {
    showError(payload.message);
    setStatus("", "Fix the input or check the connection, then run again.");
  }
}

function informational(key, value) {
  if (String(key).trim().toLowerCase() === "note") return true;
  const t = String(value).trim().toLowerCase();
  return t === "n/a" || t.startsWith("not available");
}

function hint(text) {
  $("result").innerHTML = "";
  const p = document.createElement("p");
  p.className = "hint";
  p.textContent = text;
  $("result").appendChild(p);
}

function showResult(title, data, action) {
  const box = $("result");
  box.innerHTML = "";
  const [label, subject] = title.includes(": ") ? [title.slice(0, title.indexOf(": ")), title.slice(title.indexOf(": ") + 2)] : [title, ""];
  const head = document.createElement("div");
  head.className = "rhead";
  head.innerHTML = "<b></b><span></span>";
  head.querySelector("b").textContent = label;
  head.querySelector("span").textContent = subject;
  box.appendChild(head);

  const dl = document.createElement("dl");
  const blur = action === "my_ip" && $("blur").checked;
  for (const [k, v] of Object.entries(data)) {
    const dt = document.createElement("dt");
    dt.textContent = k;
    const dd = document.createElement("dd");
    dd.textContent = String(v);
    if (informational(k, v)) dd.className = "info";
    else if (blur && ["IPv4", "IPv6", "IP"].includes(k)) {
      dd.classList.add("hidden");
      dd.title = "Click to show";
      dd.addEventListener("click", () => dd.classList.remove("hidden"), { once: true });
    }
    dl.append(dt, dd);
  }
  box.appendChild(dl);

  if (action === "subnet" && data["Prefix length"] !== undefined) {
    const prefix = Number(data["Prefix length"]);
    const bits = data.Version === "IPv4" ? 32 : 128;
    const filled = Math.round(32 * prefix / bits);
    const g = document.createElement("div");
    g.className = "gauge";
    g.innerHTML = `<div class="section" style="margin:0">network bits</div><div class="cells" aria-hidden="true">${
      Array.from({ length: 32 }, (_, i) => `<i class="${i < filled ? "on" : ""}"></i>`).join("")}</div><small>${prefix} network  ·  ${bits - prefix} host</small>`;
    box.appendChild(g);
  }

  const f = feature(action);
  if (f && f.fn && state.current !== "export") {
    const ran = document.createElement("div");
    ran.className = "ran";
    const ref = state.ref;
    ran.innerHTML = `Ran <code>${f.fn}</code> · <a href="${REPO}/blob/${ref}/${f.file}" target="_blank" rel="noopener">view ${f.file} on GitHub</a>`;
    box.appendChild(ran);
  }
}

function showError(message) {
  $("result").innerHTML = '<div class="error"><span class="badge">ERROR</span><p></p></div>';
  $("result").querySelector("p").textContent = message;
}

function setStatus(kind, text, spinning) {
  const badge = $("badge");
  badge.className = "badge" + (kind === "info" ? " soft" : "");
  badge.textContent = kind === "ok" ? "DONE" : kind === "error" ? "ERROR" : "";
  if (kind === "info") badge.innerHTML = '<span class="spin" aria-hidden="true"></span>';
  $("statusText").textContent = text;
}

function stamp() {
  const d = new Date(), p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}

function save(fmt) {
  if (!state.last) { setStatus("error", "Nothing to export yet. Run one of features 1 to 4 first."); return; }
  let text, type;
  if (fmt === "json") {
    text = JSON.stringify(state.last, null, 2);
    type = "application/json";
  } else {
    const q = (s) => /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
    text = ["Field,Value", ...Object.entries(state.last).map(([k, v]) => `${q(String(k))},${q(String(v))}`)].join("\r\n") + "\r\n";
    type = "text/csv";
  }
  const name = `result_${stamp()}.${fmt}`;
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  setStatus("ok", `Saved ${name} to your downloads.`);
}

$("inputRow").addEventListener("submit", (e) => { e.preventDefault(); run(); });
$("myipBtn").addEventListener("click", run);
$("jsonBtn").addEventListener("click", () => save("json"));
$("csvBtn").addEventListener("click", () => save("csv"));
document.addEventListener("keydown", (e) => {
  const typing = e.target.tagName === "INPUT" && e.target.type !== "checkbox";
  if (!typing && !e.ctrlKey && !e.metaKey && !e.altKey && /^[1-5]$/.test(e.key)) {
    select(FEATURES[Number(e.key) - 1].action);
    e.preventDefault();
  } else if (!typing && e.key === "Enter" && state.current === "my_ip") {
    run();
  }
});

buildNav();
const start = new URLSearchParams(location.search).get("f");
select(FEATURES.some((f) => f.action === start) ? start : "my_ip");
setStatus("info", "Starting Python in your browser …", true);
</script>
</body>
</html>
